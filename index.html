<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Day Planner</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #0a0a0a; --surface: #141414; --surface2: #1c1c1c; --border: #2a2a2a;
  --text: #f0f0f0; --muted: #6a6a6a; --faint: #3a3a3a;
  --morning: #f5c842; --afternoon: #f57c42; --evening: #4287f5; --tomorrow: #777;
  --success: #42f577; --danger: #f55; --now: #42f577;
}
html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
body { padding-bottom: 68px; }

/* SETUP */
#setup { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px; gap: 18px; }
.setup-title { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
.setup-sub { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.6; max-width: 320px; }
.token-input { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; color: var(--text); font-family: ui-monospace, monospace; font-size: 13px; outline: none; }
.token-input:focus { border-color: var(--evening); }
.btn-primary { width: 100%; max-width: 360px; background: var(--text); color: var(--bg); border: none; border-radius: 10px; padding: 15px; font-size: 15px; font-weight: 600; cursor: pointer; }

/* APP SHELL */
#app { display: none; }
.head { padding: 22px 20px 10px; max-width: 640px; margin: 0 auto; display: flex; justify-content: space-between; align-items: flex-end; }
.head-date { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; }
.head-title { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.1; margin-top: 2px; }
.head-right { font-size: 12px; color: var(--muted); text-align: right; }

.pane { display: none; max-width: 640px; margin: 0 auto; padding: 0 20px; }
.pane.on { display: block; }

/* TABS */
.tabs { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,10,10,0.96); border-top: 1px solid var(--border); display: flex; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
.tab { flex: 1; padding: 14px 4px 16px; text-align: center; font-size: 12px; color: var(--muted); cursor: pointer; border-top: 2px solid transparent; }
.tab.on { color: var(--text); border-top-color: var(--text); }

/* SECTION */
.sec { margin: 22px 0 8px; display: flex; align-items: baseline; gap: 10px; }
.sec-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.sec-name { font-size: 13px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
.sec-time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* TASK CARD (Today) */
.tcard { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; overflow: hidden; }
.tcard-main { display: flex; align-items: flex-start; gap: 11px; padding: 13px 14px; cursor: pointer; }
.box { width: 20px; height: 20px; border: 1.5px solid #3d3d3d; border-radius: 5px; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: transparent; }
.box.on { background: var(--success); border-color: var(--success); color: #062; }
.tcard-body { flex: 1; min-width: 0; }
.tcard-name { font-size: 14.5px; font-weight: 500; line-height: 1.35; }
.tcard-name.struck { color: var(--muted); text-decoration: line-through; }
.tcard-goal { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 4px; line-height: 1.4; }
.tcard-meta { margin-top: 6px; display: flex; gap: 5px; flex-wrap: wrap; }
.pill { font-size: 9.5px; padding: 2px 7px; border-radius: 20px; border: 1px solid var(--faint); color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
.pill.must { border-color: #7a2f2a; color: #e0736a; }
.pill.next { border-color: #2a6b4a; color: #5fd39b; }
.chev { color: var(--faint); font-size: 12px; padding-top: 3px; }

/* HERO */
.hero { background: linear-gradient(160deg, #191919, #121212); border: 1px solid #333; border-radius: 16px; padding: 18px 17px 16px; margin-top: 18px; }
.hero-tag { font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--success); font-weight: 700; margin-bottom: 11px; display: flex; align-items: center; gap: 8px; }
.hero-tag span.blk { color: var(--muted); font-weight: 400; letter-spacing: 1.5px; }
.hero-name { font-size: 20px; font-weight: 600; line-height: 1.3; letter-spacing: -0.3px; }
.hero-goal { font-size: 13px; color: #9a9a9a; font-style: italic; margin-top: 8px; line-height: 1.45; }
.hero-meta { margin-top: 11px; display: flex; gap: 5px; flex-wrap: wrap; }
.hero-acts { display: flex; gap: 8px; margin-top: 16px; }
.hero-done { flex: 3; background: var(--success); color: #04301a; border: none; border-radius: 10px; padding: 13px; font-size: 14.5px; font-weight: 700; cursor: pointer; }
.hero-skip { flex: 1; background: none; border: 1px solid var(--faint); color: var(--muted); border-radius: 10px; padding: 13px 8px; font-size: 13px; cursor: pointer; }
.hero-steps { margin-top: 14px; border-top: 1px solid #2c2c2c; padding-top: 6px; }
.hero-empty { text-align: center; padding: 34px 16px; color: var(--muted); }
.hero-empty b { display: block; font-size: 17px; color: var(--text); margin-bottom: 6px; font-weight: 600; }

.hero.pinned { border-color: #6b5a1f; background: linear-gradient(160deg, #1d1a10, #141209); }
.hero-tag.pin { color: var(--morning); }
.hero-done.pin { background: var(--morning); color: #332600; }
.unpin { background: none; border: none; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 4px 8px; }
.pinbtn { width: 100%; margin-top: 7px; padding: 9px; border-radius: 8px; border: 1px dashed var(--faint); background: none; color: var(--muted); font-size: 12px; cursor: pointer; }
.pinbtn.on { border: 1px solid var(--morning); color: var(--morning); background: rgba(245,200,66,0.07); font-weight: 600; }

/* SUB STEPS */
.subs { border-top: 1px solid var(--border); padding: 6px 14px 12px 45px; display: none; }
.subs.open { display: block; }
.sub { display: flex; align-items: flex-start; gap: 9px; padding: 7px 0; cursor: pointer; }
.sbox { width: 16px; height: 16px; border: 1.5px solid #3d3d3d; border-radius: 50%; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: transparent; }
.sbox.on { background: #4a4a4a; border-color: #4a4a4a; color: #ccc; }
.sub-n { font-size: 11px; color: var(--faint); min-width: 14px; padding-top: 1px; }
.sub-t { font-size: 13px; line-height: 1.4; flex: 1; }
.sub-t.struck { color: var(--faint); text-decoration: line-through; }
.note-blk { font-size: 11.5px; color: var(--muted); font-style: italic; line-height: 1.5; border-left: 2px solid var(--border); padding: 3px 0 3px 10px; margin-top: 8px; }

/* PLAN MODE */
.pcard { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 9px; }
.pcard.assigned { opacity: 0.42; }
.pcard-name { font-size: 15px; font-weight: 500; line-height: 1.35; margin-bottom: 5px; }
.pbtns { display: flex; gap: 6px; margin-top: 12px; }
.pbtn { flex: 1; padding: 9px 4px; border-radius: 8px; border: 1px solid var(--faint); background: none; font-size: 11px; cursor: pointer; color: var(--muted); }
.pbtn.m { border-color: rgba(245,200,66,0.35); color: var(--morning); }
.pbtn.a { border-color: rgba(245,124,66,0.35); color: var(--afternoon); }
.pbtn.e { border-color: rgba(66,135,245,0.35); color: var(--evening); }
.pbtn.t { border-color: var(--faint); color: var(--tomorrow); }
.pbtn.on { background: rgba(255,255,255,0.07); font-weight: 600; }
.badge { display: inline-block; font-size: 9.5px; padding: 2px 8px; border-radius: 20px; margin-top: 7px; text-transform: uppercase; letter-spacing: 0.8px; }

/* SCHEDULE */
.slot { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid #1a1a1a; }
.slot.nowrow { background: rgba(66,245,119,0.05); margin: 0 -10px; padding-left: 10px; padding-right: 10px; border-radius: 6px; }
.slot-t { font-size: 12px; color: var(--muted); min-width: 46px; font-variant-numeric: tabular-nums; padding-top: 1px; }
.slot.nowrow .slot-t { color: var(--now); font-weight: 600; }
.slot-l { font-size: 13.5px; flex: 1; }
.slot-l.dim { color: var(--muted); }
.slot-l.work { font-weight: 600; }
.slot-tag { font-size: 9.5px; color: var(--faint); text-transform: uppercase; letter-spacing: 1px; margin-left: 6px; }
.daysel { display: flex; gap: 5px; margin: 16px 0 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.dbtn { padding: 7px 13px; border-radius: 20px; border: 1px solid var(--border); background: none; color: var(--muted); font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.dbtn.on { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 600; }

/* MISC */
.drawer-h { display: flex; align-items: center; gap: 9px; padding: 13px 2px; margin-top: 14px; border-top: 1px solid var(--border); cursor: pointer; }
.drawer-arrow { color: var(--faint); font-size: 11px; width: 10px; }
.drawer-name { font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; flex: 1; }
.drawer-n { font-size: 12px; color: var(--faint); }
.pill.late { border-color: #7a2f2a; color: #e0736a; }
.pill.today { border-color: #7a6a2a; color: #e0c96a; }
.empty { padding: 26px 0; text-align: center; color: var(--faint); font-size: 13px; font-style: italic; }
.spin { width: 26px; height: 26px; border: 2px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: sp 0.8s linear infinite; margin: 40px auto; }
@keyframes sp { to { transform: rotate(360deg); } }
#toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #1a0808; border: 1px solid #3a1010; color: var(--danger); padding: 10px 18px; border-radius: 8px; font-size: 12px; z-index: 300; display: none; max-width: 90%; text-align: center; }
#toast.on { display: block; }
#toast.ok { background: #08180c; border-color: #16401f; color: var(--success); }
.reload { background: none; border: none; color: var(--muted); font-size: 12px; text-decoration: underline; cursor: pointer; padding: 4px; }
</style>
</head>
<body>

<div id="setup">
  <div class="setup-title">Day Planner</div>
  <div class="setup-sub">Cola o teu token de integração do Notion.</div>
  <input class="token-input" id="tok" type="password" placeholder="ntn_..." autocomplete="off" spellcheck="false">
  <button class="btn-primary" onclick="saveTok()">Ligar</button>
  <div class="setup-sub" style="font-size:11px">Guardado só neste dispositivo.</div>
</div>

<div id="app">
  <div class="head">
    <div>
      <div class="head-date" id="hdate"></div>
      <div class="head-title" id="htitle">Hoje</div>
    </div>
    <div class="head-right">
      <div id="hcount"></div>
      <button class="reload" onclick="loadTasks(true)">atualizar</button>
    </div>
  </div>

  <div class="pane on" id="pane-today"></div>
  <div class="pane" id="pane-plan"></div>
  <div class="pane" id="pane-sched"></div>
</div>

<div class="tabs" id="tabs" style="display:none">
  <div class="tab on" data-p="today" onclick="go('today')">Hoje</div>
  <div class="tab" data-p="plan" onclick="go('plan')">Planear</div>
  <div class="tab" data-p="sched" onclick="go('sched')">Horário</div>
</div>

<div id="toast"></div>

<script>
var DB = '327fd376d1e8805492def9d3a1bf59e0';
var API = 'https://icy-frost-a743.ssdhwswqyt.workers.dev';
var VER = '2022-06-28';

var tasks = [];
var subsCache = {};
var pane = 'today';
var schedDay = null;

var DAYS = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
var MON = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

/* ---------- SCHEDULE (hardcoded) ---------- */
function weekday(t, extra) {
  return [
    { t:'08:00', l:'Acordar', k:'dim' },
    { t:'08:00', l:'Morning Routine', k:'dim' },
    { t:'08:45', l:'Planear o dia', k:'dim' },
    { t:'09:00', l:'Trabalho — bloco 1', k:'work', tag:'Manhã' },
    { t:'13:00', l:'Meditar', k:'dim' },
    { t:'13:30', l:'Almoço', k:'dim' },
    { t:'14:30', l:'Trabalho — bloco 2', k:'work', tag:'Tarde' },
    { t:'18:30', l:'Livre', k:'dim' },
    { t:'19:15', l:'Viagem', k:'dim' },
    { t:'19:30', l:'Jiu-Jitsu', k:'work' },
    { t:'21:00', l:'Viagem', k:'dim' },
    { t:'21:15', l:'Jantar', k:'dim' },
    { t:'22:00', l: extra || 'Livre', k: extra ? 'work' : 'dim' },
    { t:'22:30', l:'Wind Down', k:'work', tag:'Noite' },
    { t:'23:30', l:'Night Routine', k:'dim' },
    { t:'00:00', l:'Dormir', k:'dim' }
  ];
}
var SCHED = {
  1: weekday(),
  2: weekday('Treinar Flair'),
  3: weekday(),
  4: weekday('Treinar Flair'),
  5: weekday(),
  6: [
    { t:'08:00', l:'Acordar', k:'dim' },
    { t:'08:00', l:'Morning Routine', k:'dim' },
    { t:'09:00', l:'Bloco flexível', k:'work', tag:'Manhã' },
    { t:'13:00', l:'Almoço', k:'dim' },
    { t:'14:30', l:'Livre', k:'dim' },
    { t:'22:30', l:'Wind Down', k:'work', tag:'Noite' },
    { t:'23:30', l:'Night Routine', k:'dim' },
    { t:'00:00', l:'Dormir', k:'dim' }
  ],
  0: [
    { t:'08:00', l:'Acordar', k:'dim' },
    { t:'08:00', l:'Morning Routine', k:'dim' },
    { t:'09:00', l:'Livre', k:'dim' },
    { t:'13:00', l:'Almoço', k:'dim' },
    { t:'15:00', l:'Revisão Semanal', k:'work' },
    { t:'16:00', l:'Livre', k:'dim' },
    { t:'22:30', l:'Wind Down', k:'work', tag:'Noite' },
    { t:'23:30', l:'Night Routine', k:'dim' },
    { t:'00:00', l:'Dormir', k:'dim' }
  ]
};
var BLOCKS = [
  { key:'Morning',   name:'Manhã',  time:'09:00 – 13:00', col:'var(--morning)' },
  { key:'Afternoon', name:'Tarde',  time:'14:30 – 18:30', col:'var(--afternoon)' },
  { key:'Evening',   name:'Noite',  time:'22:00 – 23:30', col:'var(--evening)' }
];

/* ---------- TOKEN ---------- */
function tok() { return localStorage.getItem('ndp_token'); }
function saveTok() {
  var v = document.getElementById('tok').value.replace(/^\s+|\s+$/g, '');
  if (!v) { toast('Cola o token primeiro'); return; }
  localStorage.setItem('ndp_token', v);
  start();
}

/* ---------- API ---------- */
function nr(path, method, body) {
  var opt = {
    method: method || 'GET',
    headers: {
      'Authorization': 'Bearer ' + tok(),
      'Content-Type': 'application/json',
      'Notion-Version': VER
    }
  };
  if (body) opt.body = JSON.stringify(body);
  return fetch(API + path, opt).then(function(r) {
    if (!r.ok) return r.json().then(function(e) { throw new Error(e.message || ('HTTP ' + r.status)); });
    return r.json();
  });
}

function txt(arr) {
  if (!arr || !arr.length) return '';
  var s = '';
  for (var i = 0; i < arr.length; i++) s += arr[i].plain_text;
  return s;
}

/* ---------- LOAD ---------- */
function loadTasks(silent) {
  if (!silent) document.getElementById('pane-' + pane).innerHTML = '<div class="spin"></div>';
  return nr('/databases/' + DB + '/query', 'POST', {
    filter: { and: [
      { property: 'Status', select: { does_not_equal: 'Done' } },
      { property: 'Level', multi_select: { does_not_contain: 'Drop-worthy' } },
      { property: 'Level', multi_select: { does_not_contain: 'Full Catch-Up' } }
    ]},
    page_size: 100
  }).then(function(d) {
    tasks = [];
    for (var i = 0; i < d.results.length; i++) {
      var p = d.results[i];
      var pr = p.properties;
      var goal = '';
      if (pr['Main Goal'] && pr['Main Goal'].rich_text) goal = txt(pr['Main Goal'].rich_text);
      else if (pr['Guiding Step'] && pr['Guiding Step'].rich_text) goal = txt(pr['Guiding Step'].rich_text);
      var lv = [];
      if (pr.Level && pr.Level.multi_select) for (var j = 0; j < pr.Level.multi_select.length; j++) lv.push(pr.Level.multi_select[j].name);
      var dom = '';
      if (pr.Domain && pr.Domain.multi_select && pr.Domain.multi_select.length) dom = pr.Domain.multi_select[0].name;
      tasks.push({
        id: p.id,
        name: (pr.Name && pr.Name.title) ? txt(pr.Name.title) : 'Sem nome',
        status: (pr.Status && pr.Status.select) ? pr.Status.select.name : 'To Do',
        goal: goal,
        levels: lv,
        domain: dom,
        block: (pr['Time Block'] && pr['Time Block'].select) ? pr['Time Block'].select.name : null,
        first: (pr['Do First'] && pr['Do First'].checkbox) ? true : false,
        deadline: (pr.Deadline && pr.Deadline.date) ? pr.Deadline.date.start.substring(0,10) : null,
        created: p.created_time
      });
    }
    render();
  }).catch(function(e) {
    toast('Erro: ' + e.message);
    document.getElementById('pane-' + pane).innerHTML = '<div class="empty">Não foi possível carregar.</div>';
  });
}

function loadSubs(id) {
  if (subsCache[id]) return Promise.resolve(subsCache[id]);
  return nr('/blocks/' + id + '/children?page_size=100').then(function(d) {
    var steps = [], notes = [];
    for (var i = 0; i < d.results.length; i++) {
      var b = d.results[i];
      if (b.type === 'to_do') {
        steps.push({ id: b.id, text: txt(b.to_do.rich_text), checked: b.to_do.checked });
      } else if (b.type === 'callout' && b.callout) {
        var c = txt(b.callout.rich_text);
        if (c) notes.push(c);
      } else if (b.type === 'paragraph' && b.paragraph) {
        var t = txt(b.paragraph.rich_text);
        if (t && t.length > 3) notes.push(t);
      }
    }
    subsCache[id] = { steps: steps, notes: notes };
    return subsCache[id];
  }).catch(function() { return { steps: [], notes: [] }; });
}

/* ---------- RENDER ---------- */
function render() {
  if (pane === 'today') renderToday();
  else if (pane === 'plan') renderPlan();
  else renderSched();
  var c = 0;
  for (var i = 0; i < tasks.length; i++) if (bucketOf(tasks[i]) === 'today' && !tasks[i].block) c++;
  document.getElementById('hcount').textContent = c + ' para hoje';
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function pills(t) {
  var h = '';
  for (var i = 0; i < t.levels.length; i++) {
    var c = t.levels[i] === 'Must Do' ? ' must' : (t.levels[i] === 'Do Next' ? ' next' : '');
    h += '<span class="pill' + c + '">' + esc(t.levels[i]) + '</span>';
  }
  if (t.domain) h += '<span class="pill">' + esc(t.domain) + '</span>';
  return h;
}

var skipN = 0;

function curBlockKey() {
  var n = new Date();
  var m = n.getHours() * 60 + n.getMinutes();
  if (m < 13 * 60) return 'Morning';
  if (m < 18 * 60 + 30) return 'Afternoon';
  return 'Evening';
}

function pinned() {
  for (var i = 0; i < tasks.length; i++)
    if (tasks[i].first && tasks[i].status !== 'Done') return tasks[i];
  return null;
}

function heroPick() {
  var p = pinned();
  if (p) return p;
  var order = ['Morning', 'Afternoon', 'Evening'];
  var cur = curBlockKey();
  var from = order.indexOf(cur);
  var pool = [];
  for (var o = from; o < order.length; o++) {
    var g = [];
    for (var i = 0; i < tasks.length; i++)
      if (tasks[i].block === order[o] && tasks[i].status !== 'Done') g.push(tasks[i]);
    g.sort(rank);
    for (var j = 0; j < g.length; j++) pool.push(g[j]);
  }
  for (var k = 0; k < from; k++) {
    var g2 = [];
    for (var a = 0; a < tasks.length; a++)
      if (tasks[a].block === order[k] && tasks[a].status !== 'Done') g2.push(tasks[a]);
    g2.sort(rank);
    for (var b = 0; b < g2.length; b++) pool.push(g2[b]);
  }
  if (!pool.length) return null;
  if (skipN >= pool.length) skipN = 0;
  return pool[skipN];
}

function blkName(k) {
  for (var i = 0; i < BLOCKS.length; i++) if (BLOCKS[i].key === k) return BLOCKS[i].name;
  return k;
}

function renderToday() {
  var el = document.getElementById('pane-today');
  var hero = heroPick();
  var h = '';

  if (!hero) {
    var anyAssigned = false;
    for (var z = 0; z < tasks.length; z++) if (tasks[z].block && tasks[z].block !== 'Tomorrow') anyAssigned = true;
    h += '<div class="hero"><div class="hero-empty">';
    if (anyAssigned) h += '<b>Tudo feito.</b>Nada por fazer nos blocos de hoje.';
    else h += '<b>Dia por planear.</b>Vai a Planear e atribui tarefas.';
    h += '</div></div>';
    el.innerHTML = h;
    return;
  }

  var isPin = hero.first;
  h += '<div class="hero' + (isPin ? ' pinned' : '') + '">';
  if (isPin) h += '<div class="hero-tag pin">Primeiro <span class="blk">· antes de tudo</span></div>';
  else h += '<div class="hero-tag">Agora <span class="blk">· ' + blkName(hero.block) + '</span></div>';
  h += '<div class="hero-name">' + esc(hero.name) + '</div>';
  if (hero.goal) h += '<div class="hero-goal">' + esc(hero.goal) + '</div>';
  h += '<div class="hero-meta">' + dueLabel(hero) + pills(hero) + '</div>';
  h += '<div class="hero-acts">';
  h += '<button class="hero-done' + (isPin ? ' pin' : '') + '" onclick="toggleTask(\'' + hero.id + '\')">Feito</button>';
  if (!isPin) h += '<button class="hero-skip" onclick="skipHero()">saltar</button>';
  h += '</div>';
  if (isPin) h += '<div style="text-align:center;margin-top:10px"><button class="unpin" onclick="setFirst(\'' + hero.id + '\',false)">desafixar</button></div>';
  h += '<div class="hero-steps"><div class="subs open" id="s_' + hero.id + '"></div></div>';
  h += '</div>';

  var rest = 0;
  for (var q = 0; q < tasks.length; q++) {
    var t = tasks[q];
    if (t.block && t.block !== 'Tomorrow' && t.status !== 'Done' && t.id !== hero.id) rest++;
  }
  h += '<div class="drawer-h" onclick="toggleSec(\'rest\')">';
  h += '<span class="drawer-arrow">' + (openSec.rest ? '▾' : '▸') + '</span>';
  h += '<span class="drawer-name">Resto do dia</span>';
  h += '<span class="drawer-n">' + rest + '</span></div>';

  if (openSec.rest) {
    for (var b = 0; b < BLOCKS.length; b++) {
      var blk = BLOCKS[b];
      var list = [];
      for (var i = 0; i < tasks.length; i++)
        if (tasks[i].block === blk.key && tasks[i].id !== hero.id) list.push(tasks[i]);
      if (!list.length) continue;
      list.sort(rank);
      h += '<div class="sec"><span class="sec-dot" style="background:' + blk.col + '"></span>';
      h += '<span class="sec-name">' + blk.name + '</span><span class="sec-time">' + blk.time + '</span></div>';
      for (var k = 0; k < list.length; k++) h += taskCard(list[k]);
    }
  }
  el.innerHTML = h;
  loadHeroSteps(hero.id);
}

function loadHeroSteps(id) {
  var box = document.getElementById('s_' + id);
  if (!box) return;
  box.innerHTML = '<div style="color:var(--faint);font-size:12px;padding:8px 0">a carregar…</div>';
  loadSubs(id).then(function(d) {
    var next = -1;
    for (var i = 0; i < d.steps.length; i++) if (!d.steps[i].checked) { next = i; break; }
    var h = '';
    for (var j = 0; j < d.steps.length; j++) {
      var s = d.steps[j];
      var isNext = (j === next);
      h += '<div class="sub" onclick="toggleStep(\'' + id + '\',\'' + s.id + '\')">';
      h += '<div class="sbox' + (s.checked ? ' on' : '') + '" id="b_' + s.id + '">✓</div>';
      h += '<div class="sub-n">' + (j + 1) + '.</div>';
      h += '<div class="sub-t' + (s.checked ? ' struck' : '') + '" id="t_' + s.id + '"' + (isNext ? ' style="color:var(--text);font-weight:500"' : '') + '>' + esc(s.text) + '</div></div>';
    }
    if (!d.steps.length) h = '<div style="color:var(--faint);font-size:12px;padding:6px 0">Sem passos.</div>';
    for (var n = 0; n < d.notes.length && n < 2; n++) h += '<div class="note-blk">' + esc(d.notes[n]) + '</div>';
    box.innerHTML = h;
  });
}

function skipHero() { skipN++; renderToday(); }

function setFirst(id, val) {
  var target = null, prev = [];
  for (var i = 0; i < tasks.length; i++) {
    if (tasks[i].id === id) target = tasks[i];
    else if (tasks[i].first) prev.push(tasks[i]);
  }
  if (!target) return;
  target.first = val;
  if (val) for (var j = 0; j < prev.length; j++) prev[j].first = false;
  render();
  var calls = [nr('/pages/' + id, 'PATCH', { properties: { 'Do First': { checkbox: val } } })];
  if (val) for (var k = 0; k < prev.length; k++)
    calls.push(nr('/pages/' + prev[k].id, 'PATCH', { properties: { 'Do First': { checkbox: false } } }));
  Promise.all(calls).then(function() {
    if (val) toast('Marcada para fazer primeiro', true);
  }).catch(function(e) { toast('Não gravou: ' + e.message); loadTasks(true); });
}

function taskCard(t) {
  var done = t.status === 'Done';
  var h = '<div class="tcard" id="c_' + t.id + '">';
  h += '<div class="tcard-main">';
  h += '<div class="box' + (done ? ' on' : '') + '" onclick="event.stopPropagation();toggleTask(\'' + t.id + '\')">✓</div>';
  h += '<div class="tcard-body" onclick="toggleSubs(\'' + t.id + '\')">';
  h += '<div class="tcard-name' + (done ? ' struck' : '') + '">' + esc(t.name) + '</div>';
  if (t.goal) h += '<div class="tcard-goal">' + esc(t.goal) + '</div>';
  h += '<div class="tcard-meta">' + dueLabel(t) + pills(t) + '</div>';
  h += '</div><div class="chev" onclick="toggleSubs(\'' + t.id + '\')">▾</div></div>';
  h += '<div class="subs" id="s_' + t.id + '"></div></div>';
  return h;
}

function toggleSubs(id) {
  var box = document.getElementById('s_' + id);
  if (!box) return;
  if (box.className.indexOf('open') > -1) { box.className = 'subs'; return; }
  box.className = 'subs open';
  box.innerHTML = '<div style="color:var(--faint);font-size:12px;padding:8px 0">a carregar…</div>';
  loadSubs(id).then(function(d) {
    var h = '';
    for (var i = 0; i < d.steps.length; i++) {
      var s = d.steps[i];
      h += '<div class="sub" onclick="toggleStep(\'' + id + '\',\'' + s.id + '\')">';
      h += '<div class="sbox' + (s.checked ? ' on' : '') + '" id="b_' + s.id + '">✓</div>';
      h += '<div class="sub-n">' + (i + 1) + '.</div>';
      h += '<div class="sub-t' + (s.checked ? ' struck' : '') + '" id="t_' + s.id + '">' + esc(s.text) + '</div></div>';
    }
    if (!d.steps.length) h += '<div style="color:var(--faint);font-size:12px;padding:6px 0">Sem passos.</div>';
    for (var n = 0; n < d.notes.length && n < 3; n++) h += '<div class="note-blk">' + esc(d.notes[n]) + '</div>';
    box.innerHTML = h;
  });
}

function toggleStep(pid, bid) {
  var bx = document.getElementById('b_' + bid);
  var tx = document.getElementById('t_' + bid);
  if (!bx) return;
  var now = bx.className.indexOf('on') > -1;
  var next = !now;
  bx.className = 'sbox' + (next ? ' on' : '');
  tx.className = 'sub-t' + (next ? ' struck' : '');
  nr('/blocks/' + bid, 'PATCH', { to_do: { checked: next } }).then(function() {
    var c = subsCache[pid];
    if (c) for (var i = 0; i < c.steps.length; i++) if (c.steps[i].id === bid) c.steps[i].checked = next;
  }).catch(function(e) {
    bx.className = 'sbox' + (now ? ' on' : '');
    tx.className = 'sub-t' + (now ? ' struck' : '');
    toast('Não gravou: ' + e.message);
  });
}

function toggleTask(id) {
  var t = null;
  for (var i = 0; i < tasks.length; i++) if (tasks[i].id === id) t = tasks[i];
  if (!t) return;
  var goingDone = t.status !== 'Done';
  var newStatus = goingDone ? 'Done' : 'To Do';
  var prev = t.status;
  t.status = newStatus;
  renderToday();
  var props = { Status: { select: { name: newStatus } } };
  if (goingDone && t.first) { props['Do First'] = { checkbox: false }; t.first = false; }
  nr('/pages/' + id, 'PATCH', { properties: props })
    .then(function() { skipN = 0; toast(goingDone ? 'Feito ✓' : 'Reaberto', true); })
    .catch(function(e) { t.status = prev; renderToday(); toast('Não gravou: ' + e.message); });
}

/* ---------- PLAN ---------- */
var openSec = { week: false, recur: false, nodate: false, rest: false };

function todayStr() {
  var n = new Date();
  var m = n.getMonth() + 1, d = n.getDate();
  return n.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (d < 10 ? '0' + d : d);
}
function plusDays(k) {
  var n = new Date();
  n.setDate(n.getDate() + k);
  var m = n.getMonth() + 1, d = n.getDate();
  return n.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (d < 10 ? '0' + d : d);
}

function bucketOf(t) {
  var today = todayStr();
  if (t.status === 'Recurring Block') return 'recur';
  var has = !!t.deadline;
  if (has && t.deadline <= today) return 'today';
  if (t.status === 'Waiting') return has ? 'hidden' : 'hidden';
  if (t.block === 'Tomorrow') return 'today';
  if (has && t.deadline <= plusDays(7)) return 'week';
  if (has) return 'hidden';
  if (t.status === 'In Progress') return 'today';
  if (t.levels.indexOf('Must Do') > -1) return 'today';
  return 'nodate';
}

function renderPlan() {
  var el = document.getElementById('pane-plan');
  var b = { today: [], week: [], recur: [], nodate: [] };
  for (var i = 0; i < tasks.length; i++) {
    var k = bucketOf(tasks[i]);
    if (b[k]) b[k].push(tasks[i]);
  }
  b.today.sort(rank);
  b.week.sort(byDate);
  b.nodate.sort(byCreated);
  b.recur.sort(rank);

  var h = '';
  h += '<div class="sec"><span class="sec-name">Para hoje</span><span class="sec-time">' + b.today.length + '</span></div>';
  if (!b.today.length) h += '<div class="empty">Nada urgente. Vê as gavetas abaixo.</div>';
  for (var a = 0; a < b.today.length; a++) h += planCard(b.today[a]);

  h += drawer('week', 'Esta semana', b.week, 'Nada nos próximos 7 dias.');
  h += drawer('recur', 'Sempre disponíveis', b.recur, 'Sem blocos recorrentes.');
  h += drawer('nodate', 'Sem data', b.nodate, 'Vazio — bom sinal.');

  el.innerHTML = h;
}

function drawer(key, label, list, emptyMsg) {
  var open = openSec[key];
  var h = '<div class="drawer-h" onclick="toggleSec(\'' + key + '\')">';
  h += '<span class="drawer-arrow">' + (open ? '▾' : '▸') + '</span>';
  h += '<span class="drawer-name">' + label + '</span>';
  h += '<span class="drawer-n">' + list.length + '</span></div>';
  if (open) {
    if (!list.length) h += '<div class="empty">' + emptyMsg + '</div>';
    for (var i = 0; i < list.length; i++) h += planCard(list[i]);
  }
  return h;
}

function toggleSec(k) { openSec[k] = !openSec[k]; if (pane === 'today') renderToday(); else renderPlan(); }

function byDate(a, b) { return (a.deadline < b.deadline) ? -1 : 1; }
function byCreated(a, b) { return (a.created < b.created) ? -1 : 1; }

function rank(a, b) {
  var f = function(t) {
    if (t.levels.indexOf('Must Do') > -1) return 0;
    if (t.status === 'In Progress') return 1;
    if (t.levels.indexOf('Do Next') > -1) return 2;
    return 3;
  };
  var d = f(a) - f(b);
  if (d !== 0) return d;
  if (a.deadline && b.deadline) return (a.deadline < b.deadline) ? -1 : 1;
  if (a.deadline) return -1;
  if (b.deadline) return 1;
  return (a.created < b.created) ? -1 : 1;
}

function dueLabel(t) {
  if (!t.deadline) return '';
  var today = todayStr();
  if (t.deadline < today) return '<span class="pill late">atrasada</span>';
  if (t.deadline === today) return '<span class="pill today">hoje</span>';
  return '<span class="pill">' + t.deadline.substring(8,10) + '/' + t.deadline.substring(5,7) + '</span>';
}

function planCard(t) {
  var h = '<div class="pcard' + (t.block && t.block !== 'Tomorrow' ? ' assigned' : '') + '">';
  h += '<div class="pcard-name">' + esc(t.name) + '</div>';
  if (t.goal) h += '<div class="tcard-goal">' + esc(t.goal) + '</div>';
  h += '<div class="tcard-meta">' + dueLabel(t) + pills(t);
  if (t.status === 'Waiting') h += '<span class="pill">à espera</span>';
  h += '</div>';
  h += '<div class="pbtns">';
  var m = [['Morning','m','Manhã'],['Afternoon','a','Tarde'],['Evening','e','Noite'],['Tomorrow','t','Amanhã']];
  for (var i = 0; i < m.length; i++) {
    var on = t.block === m[i][0] ? ' on' : '';
    h += '<button class="pbtn ' + m[i][1] + on + '" onclick="assign(\'' + t.id + '\',\'' + m[i][0] + '\')">' + m[i][2] + '</button>';
  }
  h += '</div>';
  h += '<button class="pinbtn' + (t.first ? ' on' : '') + '" onclick="setFirst(\'' + t.id + '\',' + (t.first ? 'false' : 'true') + ')">' + (t.first ? '★  Fazer primeiro' : '☆  Fazer primeiro') + '</button>';
  h += '</div>';
  return h;
}

function assign(id, block) {
  var t = null;
  for (var i = 0; i < tasks.length; i++) if (tasks[i].id === id) t = tasks[i];
  if (!t) return;
  var prev = t.block;
  var val = (prev === block) ? null : block;
  t.block = val;
  renderPlan();
  nr('/pages/' + id, 'PATCH', { properties: { 'Time Block': val ? { select: { name: val } } : { select: null } } })
    .catch(function(e) { t.block = prev; renderPlan(); toast('Não gravou: ' + e.message); });
}

/* ---------- SCHEDULE ---------- */
function renderSched() {
  var el = document.getElementById('pane-sched');
  var today = new Date().getDay();
  if (schedDay === null) schedDay = today;
  var h = '<div class="daysel">';
  var order = [1,2,3,4,5,6,0];
  for (var i = 0; i < order.length; i++) {
    var d = order[i];
    h += '<button class="dbtn' + (d === schedDay ? ' on' : '') + '" onclick="setDay(' + d + ')">' + DAYS[d].substring(0,3) + '</button>';
  }
  h += '</div>';
  var rows = SCHED[schedDay];
  var nowMin = -1;
  if (schedDay === today) { var n = new Date(); nowMin = n.getHours() * 60 + n.getMinutes(); }
  for (var r = 0; r < rows.length; r++) {
    var cur = toMin(rows[r].t);
    var nxt = (r + 1 < rows.length) ? toMin(rows[r + 1].t) : 1440;
    if (nxt <= cur) nxt = 1440;
    var isNow = nowMin >= cur && nowMin < nxt;
    h += '<div class="slot' + (isNow ? ' nowrow' : '') + '">';
    h += '<div class="slot-t">' + rows[r].t + '</div>';
    h += '<div class="slot-l ' + rows[r].k + '">' + rows[r].l;
    if (rows[r].tag) h += '<span class="slot-tag">' + rows[r].tag + '</span>';
    h += '</div></div>';
  }
  el.innerHTML = h;
}
function toMin(s) { return parseInt(s.substring(0,2),10) * 60 + parseInt(s.substring(3,5),10); }
function setDay(d) { schedDay = d; renderSched(); }

/* ---------- NAV ---------- */
function go(p) {
  pane = p;
  var ps = document.querySelectorAll('.pane');
  for (var i = 0; i < ps.length; i++) ps[i].className = 'pane';
  document.getElementById('pane-' + p).className = 'pane on';
  var ts = document.querySelectorAll('.tab');
  for (var j = 0; j < ts.length; j++) ts[j].className = (ts[j].getAttribute('data-p') === p) ? 'tab on' : 'tab';
  document.getElementById('htitle').textContent = p === 'today' ? 'Hoje' : (p === 'plan' ? 'Planear' : 'Horário');
  render();
}

function toast(m, ok) {
  var t = document.getElementById('toast');
  t.textContent = m;
  t.className = ok ? 'on ok' : 'on';
  setTimeout(function() { t.className = ''; }, 3500);
}

function start() {
  document.getElementById('setup').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('tabs').style.display = 'flex';
  var n = new Date();
  document.getElementById('hdate').textContent = DAYS[n.getDay()] + ', ' + n.getDate() + ' ' + MON[n.getMonth()];
  loadTasks();
}

if (tok()) start();
</script>
</body>
</html>
